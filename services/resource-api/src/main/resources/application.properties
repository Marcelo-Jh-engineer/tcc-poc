quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:8000
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/poc-sso}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:resource-api}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/poc}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:poc}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:poc}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=catalog
quarkus.flyway.default-schema=catalog
quarkus.flyway.create-schemas=true
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.database.default-schema=catalog
quarkus.smallrye-health.root-path=/health
