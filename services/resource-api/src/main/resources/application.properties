quarkus.http.port=${QUARKUS_HTTP_PORT:8081}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:8000
quarkus.http.cors.methods=GET,POST,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.oidc.auth-server-url=${QUARKUS_OIDC_AUTH_SERVER_URL:http://localhost:8180/realms/poc-sso}
quarkus.oidc.client-id=${QUARKUS_OIDC_CLIENT_ID:resource-api}
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any
quarkus.smallrye-health.root-path=/health

